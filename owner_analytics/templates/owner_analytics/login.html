<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OES Owner Analytics</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/owner-analytics.css') }}">
</head>
<body class="owner-shell owner-shell--login">
  <main class="owner-login" aria-labelledby="login-title">
    <p class="owner-kicker">OTIS EXECUTION SYSTEMS</p>
    <h1 id="login-title">Owner Analytics</h1>
    <p class="owner-muted">Private operational reporting · UTC baseline</p>
    {% if error %}<p class="owner-alert" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('owner_analytics.login') }}" autocomplete="off">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Owner ID<input name="username" required maxlength="64" autocomplete="username"></label>
      <label>Password<input type="password" name="password" required maxlength="256" autocomplete="current-password"></label>
      <label>Authenticator code<input name="totp" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code"></label>
      <button type="submit">Verify and enter</button>
    </form>
  </main>
</body>
</html>
